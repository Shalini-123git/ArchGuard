name: ArchGuard PR check

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build CLI
        run: mvn -B -pl cli -am install -DskipTests
      - name: Prepare CLI runtime classpath
        run: mvn -B -pl cli dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency
      - name: Scan pull request
        id: scan
        shell: bash
        run: |
          set +e
          java -cp 'cli/target/classes:cli/target/dependency/*' com.archguard.cli.ArchGuardCli scan . --exclude sample-project --rules archguard-rules.yml > archguard-report.txt 2>&1
          scan_status=$?
          set -e
          cat archguard-report.txt
          value() { sed -n "s/^$1: //p" archguard-report.txt | head -n 1; }
          {
            echo "status=$scan_status"
            echo "packages=$(value Packages)"
            echo "edges=$(value Edges)"
            echo "parse_failures=$(value 'Parse failures')"
            echo "cycles=$(value Cycles)"
            echo "violations=$(value Violations)"
          } >> "$GITHUB_OUTPUT"
          if [ "$scan_status" -ne 0 ] && [ "$scan_status" -ne 2 ]; then
            exit "$scan_status"
          fi
      - name: Post or update summary comment
        if: always() && github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
          PACKAGES: ${{ steps.scan.outputs.packages }}
          EDGES: ${{ steps.scan.outputs.edges }}
          PARSE_FAILURES: ${{ steps.scan.outputs.parse_failures }}
          CYCLES: ${{ steps.scan.outputs.cycles }}
          VIOLATIONS: ${{ steps.scan.outputs.violations }}
        with:
          script: |
            const marker = '<!-- archguard-pr-check -->';
            const failed = process.env.SCAN_STATUS !== '0';
            const verdict = failed ? '❌ Violations found' : '✅ No violations found';
            const body = `${marker}\n## ArchGuard\n\n${verdict}\n\n| Packages | Edges | Parse failures | Cycles | Violations |\n| ---: | ---: | ---: | ---: | ---: |\n| ${process.env.PACKAGES || 'n/a'} | ${process.env.EDGES || 'n/a'} | ${process.env.PARSE_FAILURES || 'n/a'} | ${process.env.CYCLES || 'n/a'} | ${process.env.VIOLATIONS || 'n/a'} |`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail when violations are found
        if: steps.scan.outputs.status == '2'
        run: exit 2
