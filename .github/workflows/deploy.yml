name: Build and Push Docker Images

# Builds the api and web images on GitHub's own runners (plenty of RAM),
# and pushes them to GitHub Container Registry (ghcr.io). The EC2 instance
# never builds anything itself -- it only ever pulls finished images.
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab too

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # needed to push to ghcr.io using the built-in token
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase image name (GHCR requires lowercase)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # no extra secret to create -- provided automatically

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max