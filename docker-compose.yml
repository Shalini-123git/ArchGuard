services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - archguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    # Replace with your actual GHCR image path (all lowercase),
    # e.g. ghcr.io/yourusername/archguard-api:latest
    image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME-api:latest
    restart: unless-stopped
    environment:
      ARCHGUARD_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      ARCHGUARD_DB_USERNAME: ${POSTGRES_USER}
      ARCHGUARD_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: ${ARCHGUARD_JAVA_TOOL_OPTIONS}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ARCHGUARD_LLM_MODEL: ${ARCHGUARD_LLM_MODEL:-llama-3.3-70b-versatile}
      ARCHGUARD_LLM_MAX_TOKENS: ${ARCHGUARD_LLM_MAX_TOKENS:-1500}
      ARCHGUARD_LLM_DELAY_BETWEEN_CALLS_MS: ${ARCHGUARD_LLM_DELAY_BETWEEN_CALLS_MS:-400}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  web:
    image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME-web:latest
    restart: unless-stopped
    ports:
      # Bound to localhost only -- Caddy is the sole public entry point.
      - "127.0.0.1:${ARCHGUARD_WEB_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  archguard-postgres: