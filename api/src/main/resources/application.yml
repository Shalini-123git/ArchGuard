spring:
  datasource:
    url: ${ARCHGUARD_DB_URL:jdbc:postgresql://localhost:5432/archguard}
    username: ${ARCHGUARD_DB_USERNAME:archguard}
    password: ${ARCHGUARD_DB_PASSWORD:archguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

archguard:
  ingestion:
    max-clone-bytes: ${ARCHGUARD_MAX_CLONE_BYTES:104857600}
    clone-timeout: ${ARCHGUARD_CLONE_TIMEOUT:60s}
  scan:
    local-enabled: ${ARCHGUARD_LOCAL_SCAN_ENABLED:false}
    core-pool-size: ${ARCHGUARD_SCAN_CORE_POOL_SIZE:2}
    max-pool-size: ${ARCHGUARD_SCAN_MAX_POOL_SIZE:4}
    queue-capacity: ${ARCHGUARD_SCAN_QUEUE_CAPACITY:20}
  llm:
    api-key: ${LLM_API_KEY:}
    model: ${ARCHGUARD_LLM_MODEL:llama-3.3-70b-versatile}
    connect-timeout: ${ARCHGUARD_LLM_CONNECT_TIMEOUT:5s}
    read-timeout: ${ARCHGUARD_LLM_READ_TIMEOUT:20s}
    retry-backoff: ${ARCHGUARD_LLM_RETRY_BACKOFF:500ms}
    max-tokens: ${ARCHGUARD_LLM_MAX_TOKENS:1500}
    delay-between-calls-ms: ${ARCHGUARD_LLM_DELAY_BETWEEN_CALLS_MS:400}
    blast-radius-limit: ${ARCHGUARD_LLM_BLAST_RADIUS_LIMIT:10}
    snippet-line-limit: ${ARCHGUARD_LLM_SNIPPET_LINE_LIMIT:3}
    violations-per-scan-limit: ${ARCHGUARD_LLM_VIOLATIONS_PER_SCAN_LIMIT:20}
