spring:
  datasource:
    url: ${ARCHGUARD_DB_URL:jdbc:postgresql://localhost:5432/archguard}
    username: ${ARCHGUARD_DB_USERNAME:archguard}
    password: ${ARCHGUARD_DB_PASSWORD:archguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

archguard:
  ingestion:
    max-clone-bytes: ${ARCHGUARD_MAX_CLONE_BYTES:104857600}
    clone-timeout: ${ARCHGUARD_CLONE_TIMEOUT:60s}
  scan:
    local-enabled: ${ARCHGUARD_LOCAL_SCAN_ENABLED:false}
    core-pool-size: ${ARCHGUARD_SCAN_CORE_POOL_SIZE:2}
    max-pool-size: ${ARCHGUARD_SCAN_MAX_POOL_SIZE:4}
    queue-capacity: ${ARCHGUARD_SCAN_QUEUE_CAPACITY:20}
